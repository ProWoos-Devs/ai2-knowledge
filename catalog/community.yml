# The AI-2 community catalog: every Knowledge Pack that can be listed and
# installed, whoever made it. The AI-2 project's own packs are here with
# everyone else's, because the project is part of the community.
#
# `contact` says who made a pack and answers for it. What this repository
# checks is the same for every entry: the file is the one the entry describes,
# AI-2 installs it, and its license is one the catalog carries. Nobody checks
# whether a pack's contents are correct; its maker answers for that.
#
# Each ai-2 release carries a copy of this file inside the signed package, and
# `ai-2 knowledge install ID` resolves a name against that copy, so the SHA-256
# it checks a download against is covered by the repository key. A pack merged
# after the ai-2 you run was released is installed from its file until the
# next release lists it.
#
# The file is hosted by whoever made the pack. To add yours, follow
# CONTRIBUTING.md.
