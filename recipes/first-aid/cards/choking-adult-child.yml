schema_version: 1
status: draft-check-5-applied
id: choking-adult-child
language: en
title: Choking, adult or child
audience: untrained-bystander
population: Adult or child. IFRC gives these one set of steps.
age_definition: A child is one year or older. Under one year, use the baby choking card.
age_groups: [adult, child]
family: choking
jurisdiction: Global (IFRC). Emergency numbers are not on this card.
protocol_family: ifrc-2025
emergency_number_profile: pending-regional-profile
source_ids:
- ifrc-2025
source_editions:
- IFRC International First Aid, Resuscitation and Education Guidelines 2025
query_aliases:
- choking
- cannot breathe after eating
- food stuck in throat
- Heimlich
- abdominal thrusts
- back blows
- my child is choking
- an adult cannot speak or cough
applicability:
- Something is blocking the throat and the person still responds
exclusions:
- Baby under one year. Use the baby choking card.
display:
  urgent_help: Always get emergency help if the person could not cough, speak or breathe, even if the object comes out.
  immediate_actions:
  - text: Ask whether they are choking.
    src: p. 239
  - text: 'PARTLY BLOCKED, they can speak or cry out and can breathe, and their cough is working: tell them to keep coughing and do not interfere. Think about calling for help. Stay and watch, because it can become a full blockage.'
    src: pp. 238, 240
  - text: FULLY BLOCKED, they cannot speak, cough, cry or breathe, or they have only a weak cough and are struggling to breathe. They may clutch their throat, panic, or have blue lips, ears, fingers or toes. Hit firmly between the shoulder blades, up to 5 times. Adjust your force to the person's size, but it must still be strong enough to clear the airway.
    src: pp. 238, 239, 240, 242
  - text: If that fails, do up to 5 abdominal thrusts. Make a fist above the belly button and below the ribs, hold it with your other hand, and jerk sharply in and up.
    src: p. 240
  - text: If that fails, get emergency help immediately.
    src: p. 240
  - text: Keep alternating 5 blows and 5 thrusts until the blockage clears or the person stops responding.
    src: p. 240
  without_medical_supplies:
    state: supported
    items:
    - text: Every step on this card is done with your hands. No equipment is needed.
      src: p. 240
  supported_alternatives:
    state: none-known
    items: []
  if_help_is_delayed_or_unreachable:
    state: supported
    items:
    - text: Do not stop. Keep alternating blows and thrusts.
      src: p. 240
    - text: After a full blockage clears, medical care is still needed, because there may be internal injury, airway damage or a piece left in the lungs. No guidance was found in the sources checked on what to do if care cannot be reached.
      src: p. 241
    - text: After a partial blockage, the person should get medical care if they keep coughing, have trouble swallowing, or feel the object is still stuck.
      src: p. 241
  no_effective_substitute_for:
    state: none-known
    items:
    - text: IFRC's steps name no other way to clear a full blockage when these actions fail, apart from CPR once the person stops responding.
      src: pp. 240, 241
  do_not:
  - text: Do not sweep the mouth blindly with your fingers. It can push the object further down. Remove something only if you can see it.
    src: pp. 239, 240
  - text: Do not routinely use a suction device.
    src: p. 239
  - text: Do not give a drink to clear the blockage.
    src: p. 242
  reassess_and_change_actions:
  - text: If the person stops responding, start CPR using the card for their age. Give breaths as well as compressions if you possibly can, as these may dislodge the object.
    src: pp. 238, 240, 242
untrained_scope:
  left_out:
  - what: Thrust adaptation for pregnant or obese people
    why: IFRC refers to a separate training resource that was not read. No guidance is given here for these people beyond the steps above.
    src: p. 242
source_differences:
- 'Gap: this card has no adapted thrust for a pregnant or obese person, because IFRC''s main text does not give one.'
- IFRC is not consistent on a weak cough. Its guidelines treat a weakened or ineffective cough as a complete blockage needing back blows (p. 238), while its list of signs puts weak coughing under partial blockage (p. 239). This card follows the guideline, so a weak cough gets back blows.
- 'Chest thrusts: IFRC''s good practice points say they work as well as back blows or abdominal thrusts in a responsive adult or child (p. 238). Its evidence review supports starting with back blows and using chest thrusts mainly in unconscious people (pp. 243-244), and its steps do not describe them. This card follows the steps and does not teach them.'
