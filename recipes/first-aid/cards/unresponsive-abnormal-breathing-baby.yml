schema_version: 1
status: draft-check-5-applied
id: unresponsive-abnormal-breathing-baby
language: en
title: Not responding and not breathing normally, baby
audience: untrained-bystander
population: Baby
age_definition: Looks less than about one year old.
age_groups: [baby]
family: cpr
jurisdiction: Global (IFRC). Emergency numbers are not on this card.
protocol_family: ifrc-2025
emergency_number_profile: pending-regional-profile
source_ids:
- ifrc-2025
source_editions:
- IFRC International First Aid, Resuscitation and Education Guidelines 2025
query_aliases:
- baby CPR
- infant CPR
- baby not breathing
- infant not breathing
- newborn not breathing
- baby limp
applicability:
- Does not respond, and breathing is absent, gasping, noisy or irregular. If you are unsure whether breathing is normal, treat it as not normal.
exclusions:
- Looks one year or older. Use the child card.
display:
  urgent_help: 'Shout for help and have someone get emergency help now. Alone with a phone: call on speaker and start. Alone with no way to call while doing CPR: do CPR for one minute, then stop to get help, leaving if there is no phone nearby. Say clearly that the person is not responding and not breathing normally. The call taker may be able to guide you through CPR.'
  immediate_actions:
  - text: Pick the baby up or tap the sole of the foot. A baby who does not respond will be limp and an unusual color.
    src: p. 187
  - text: Open the airway. Tilt the head only slightly to a neutral position and lift the chin.
    src: p. 187
  - text: Spend up to 10 seconds watching the chest or belly, listening for breath and feeling for air on your cheek. Decide whether the breathing is normal. If unsure, treat it as not normal.
    src: pp. 187, 188
  - text: Get help as described above.
    src: p. 188
  - text: Give 30 chest compressions on the center of the chest, over the lower third of the breastbone, using either two fingers or two thumbs with your hands around the chest. Push fast and steadily, 100 to 120 times a minute, to at least one-third of the chest's depth, about 4 cm. For a newborn, two thumbs is preferred.
    src: pp. 186, 187, 188, 193
  - text: Give 2 breaths with your mouth over the baby's mouth and nose. Blow steadily for one second until the chest or belly rises.
    src: p. 188
  - text: Keep repeating 30 compressions and 2 breaths.
    src: p. 188
  - text: If you cannot or will not give breaths, keep doing compressions alone. Breaths matter a lot for babies, so give them if you can.
    src: pp. 186, 188
  - text: Ask someone to fetch a defibrillator (AED) if one exists. If you are alone and can see one close by, you can leave to get it quickly. Under eight years old, a pediatric device or pads should be used. If there are none, a standard one could be used. Keep doing CPR until it is ready to analyze, then follow its voice prompts, interrupting CPR as little as possible. Restart compressions immediately after a shock. When the device checks the heart or gives a shock, make sure nobody is touching the person, and warn those around you.
    src: pp. 188, 196, 197, 198
  - text: If others are there, swap every one to two minutes with as little break as possible.
    src: p. 188
  without_medical_supplies:
    state: supported
    items:
    - text: The steps on this card use only your hands and mouth. Use a firm surface when possible.
      src: pp. 187, 188
  supported_alternatives:
    state: not-applicable
    items: []
  if_help_is_delayed_or_unreachable:
    state: supported
    items:
    - text: Keep going until help arrives, or the baby shows signs of life (coughing, opening eyes or moving on purpose) and starts breathing normally.
      src: p. 188
    - text: Where no emergency service or higher care exists and CPR has not worked within the first 20 minutes, you could stop, as it is unlikely to succeed. This does not apply after drowning or severe cold.
      src: p. 188
    - text: If you must carry the baby from a remote place to care, keep doing CPR without stopping, on a firm surface.
      src: p. 189
  no_effective_substitute_for:
    state: none-known
    items:
    - text: IFRC calls for emergency services. The sources checked name nothing that replaces advanced care.
      src: pp. 188, 189
  do_not:
  - text: Do not spend time feeling for a pulse. It is not needed.
    src: p. 186
  - text: Do not give more or stronger breaths than needed, as the air goes into the stomach.
    src: p. 190
  reassess_and_change_actions:
  - text: While giving breaths, watch for movement or coughing.
    src: p. 188
  - text: If the baby does not respond but breathes normally, keep the airway open. Use the card for not responding and breathing normally.
    src: p. 188
  - text: If the baby recovers, keep watching closely until help takes over, because breathing can stop again.
    src: p. 189
untrained_scope:
  left_out:
  - what: 15 compressions to 2 breaths
    why: IFRC offers this ratio to trained responders. Untrained rescuers use 30 to 2.
    src: pp. 188, 189
  - what: Starting with breaths
    why: IFRC prefers breaths first in good practice but accepts compressions first, and its numbered steps start with compressions. The card follows the numbered steps.
    src: pp. 187, 188
  - what: Pad placement on a child or baby
    why: The device's prompts lead the rescuer.
    src: pp. 188, 189, 198
source_differences:
- IFRC notes that other guidance differs on ratios, order and hand technique for babies (pp. 188-189). This card follows IFRC's numbered steps.
- IFRC's numbered steps say that with no phone nearby you leave to get help as quickly as possible (p. 188). Another point on the same page says to do CPR for one minute first if you cannot call while doing it. This card combines them in that order.
