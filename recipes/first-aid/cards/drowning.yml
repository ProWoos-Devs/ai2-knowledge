schema_version: 1
status: draft-check-5-applied
id: drowning
language: en
title: Drowning
audience: untrained-bystander
population: Adult, child and baby, with CPR on the card for their age
age_definition: Go by how the person looks. See the CPR card for their age.
age_groups: [adult, child, baby]
jurisdiction: Global (IFRC). Emergency numbers are not on this card.
protocol_family: ifrc-2025
emergency_number_profile: pending-regional-profile
source_ids:
- ifrc-2025
source_editions:
- IFRC International First Aid, Resuscitation and Education Guidelines 2025
query_aliases:
- drowning
- pulled from water
- near drowning
- someone in trouble in the water
- we pulled a child out of water
- not breathing after swimming
applicability:
- A person in trouble in water, or just taken out of it. Drowning is often quiet, and they may not wave or call. Signs include a head low or under water, gasping, face down, upright and bobbing, trying to swim with no progress, or not answering when asked if they are OK.
exclusions: []
display:
  urgent_help: Shout for help from anyone nearby, lifeguards or emergency services as soon as you see someone in trouble. Have someone keep their eyes on the person.
  immediate_actions:
  - text: STAY OUT OF THE WATER. Reach out with something long such as a pole, branch or towel, or throw something that floats.
    warn: A panicking person can pull you under. Swimming out is dangerous even for trained people.
    src: pp. 216, 218, 219
  - text: Pull them to land or a boat using the pole, rope or floating object, then get them out of the water. A possible spine injury is no reason to delay getting an unresponsive person out.
    src: pp. 216, 219
  - text: 'Check for a response, then open the airway: gently tilt the head back and lift the chin, or a neutral head position for a baby. Check breathing. Irregular, noisy or absent breathing is not normal. If you have any doubt, treat it as not normal.'
    src: pp. 161, 187, 219, 220
  - text: 'NOT RESPONDING AND NOT BREATHING NORMALLY: get help and start CPR following the card for their age. Give the breaths as well if you possibly can, because they matter most after drowning. Do not delay them because of water in the airway. If you cannot or will not give breaths, give compressions alone. Expect vomiting, and roll them onto their side to clear it.'
    src: pp. 215, 216, 220, 222
  - text: 'NOT RESPONDING BUT BREATHING NORMALLY: if a spine injury is possible, such as a dive into shallow water, move them as little as you can and follow the spine step on the card for not responding and breathing normally. But keeping the airway clear comes first: if vomit or fluid is blocking breathing, position them so it can drain, limiting spine movement as far as you can. If no spine injury is possible, roll them onto their side so fluids can drain, or use a neutral head position for a baby. A baby can be held this way in your arms. Get medical care. Keep them warm and watch closely, because they can worsen fast or vomit.'
    src: pp. 153, 216, 219, 220, 227, 308
  - text: 'RESPONDING AND BREATHING: help them rest sitting or lying on their side. Keep them warm and watch their breathing.'
    src: p. 219
  without_medical_supplies:
    state: supported
    items:
    - text: 'Rescue can use anything long or anything that floats: branch, pole, towel, rope, boxes.'
      src: pp. 216, 218, 219
    - text: The steps of CPR use only your hands and mouth.
      src: p. 220
    - text: Keep them warm with dry clothing, and protect them from the cold ground.
      src: p. 219
  supported_alternatives:
    state: supported
    items:
    - text: If they are out of reach, use a boat, canoe, kayak or surfboard to get to them.
      limits: Only if you can do it safely. Good water skills and fitness matter, and take a float for them and for yourself.
      src: pp. 216, 218, 219
    - text: If you truly must swim to them, take something that floats.
      limits: Dangerous for anyone, so avoid it whenever possible.
      src: p. 219
  if_help_is_delayed_or_unreachable:
    state: supported
    items:
    - text: Keep doing CPR. A person who has drowned may still respond even with no defibrillator. The 20-minute stopping note on the child and baby cards does not apply after drowning.
      src: pp. 162, 188
    - text: Keep clearing vomit from the airway by rolling them onto their side, then continue.
      src: p. 220
    - text: If someone recovers, breathing trouble can develop later. If possible, have someone stay and watch them for about eight hours.
      src: p. 219
  no_effective_substitute_for:
    state: none-known
    items:
    - text: Medical care. IFRC says anyone who needed CPR after drowning should always get it. The sources checked name no replacement.
      src: p. 220
  do_not:
  - text: Do not touch a person who is actively drowning, because of the risk of being pulled in.
    src: p. 216
  - text: Do not try resuscitation in the water.
    src: p. 215
  - text: Do not remove material from the airway unless vomit or debris is blocking breathing.
    src: p. 216
  - text: Do not press on the chest of someone breathing normally in a way that makes breathing harder.
    src: p. 216
  - text: Do not try to get water out by swinging the person, hanging them upside down or giving abdominal thrusts. Water is not the blockage.
    src: p. 221
  reassess_and_change_actions:
  - text: If you see signs of life during CPR, pause for up to 10 seconds to see whether they breathe on their own.
    src: p. 220
  - text: If someone is breathing with difficulty or coughing a lot, get medical care.
    src: p. 219
  - text: If a defibrillator comes, dry the skin where the pads go. Keep doing CPR until it starts to analyze, and restart after. Follow its prompts. When the device checks the heart or gives a shock, make sure nobody is touching the person, and warn those around you. Do not use it in standing water.
    src: pp. 52, 198, 215, 220
untrained_scope:
  left_out:
  - what: Oxygen
    why: For trained providers with equipment.
    src: p. 216
  - what: Rescue breaths in the water
    why: IFRC recommends them only for specially trained rescuers.
    src: p. 215
source_differences:
- 'Order of CPR after drowning: IFRC''s good practice points say lay people start with compressions while also prioritizing early breaths (p. 216). Its first aid steps say to open the airway and give two to five breaths first (p. 220), and its background says breaths are the most important first treatment (p. 222). This card sends lay readers to the CPR card for their age, which starts with compressions.'
- 'Alone with a child or baby: IFRC''s drowning steps say to call on speaker or leave to get help (p. 220). Its child and baby CPR section says that if you cannot call while doing CPR, do one minute of CPR first (p. 188). This card sends readers to the CPR card for their age.'
