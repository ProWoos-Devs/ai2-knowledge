schema_version: 1
status: draft-check-5-applied
id: severe-bleeding
language: en
title: Severe bleeding
audience: untrained-bystander
population: Anyone. IFRC's steps for severe bleeding are not divided by age and do not describe a baby separately.
age_definition: Not age-specific in IFRC. For children it names a manufactured tourniquet only.
age_groups: [adult, child, baby]
jurisdiction: Global (IFRC). Emergency numbers are not on this card.
protocol_family: ifrc-2025
emergency_number_profile: pending-regional-profile
source_ids:
- ifrc-2025
- who-cfar
source_editions:
- IFRC International First Aid, Resuscitation and Education Guidelines 2025
- WHO Community First Aid Response Pocket Guide, printed p. 4, version to be pinned
query_aliases:
- bleeding heavily
- severe bleeding
- blood spurting
- deep cut
- no bandages
- tourniquet
- can I use a belt to stop the bleeding
- a knife is still stuck in the wound
- stabbing
applicability:
- Blood flowing or spurting from a wound on the outside of the body
exclusions:
- Bleeding inside the body. No card covers it yet.
display:
  urgent_help: Get emergency help for all severe bleeding. Say what caused the injury and how the person is.
  immediate_actions:
  - text: If they can, have the person press on their own wound with their hands while you get ready.
    src: p. 257
  - text: Help the person lie down. A chest wound has its own position, below.
    src: pp. 257, 268
  - text: Get emergency help.
    src: p. 257
  - text: Cover your hands if you can, then press hard directly on the wound. Use a dressing or cloth if you have one, but do not spend time looking for one. If blood soaks through, add another layer on top and press harder.
    warn: If an object is stuck in the wound, press around it to steady it and leave it in. If the object in a chest or belly wound is pulsing, let it pulse and steady it only loosely.
    src: pp. 256, 257, 259, 267
  - text: If pressing has not worked or cannot be done, and it is life-threatening bleeding from an arm or leg, consider a tourniquet. See Alternatives. Keep pressing on the wound.
    src: pp. 256, 257
  - text: Shock is likely after heavy blood loss. Keep them warm with clothes or blankets, and as comfortable as you can.
    src: p. 257
  - text: 'CHEST WOUND: help them into a comfortable position, typically sitting with one leg slightly raised and leaning toward the injured side, or lying propped up on that side. Press with your hands, but do not seal the wound completely, because a sealed wound can trap air in the chest. A chest wound that is not actively bleeding can stay uncovered. If it must be covered for a long journey, use a dressing that does not seal, and check that it stays open.'
    src: pp. 267, 268, 269
  - text: 'BELLY WOUND: help them lie with their knees pulled up. If organs are showing, do not push them back. Cover them with a clean, wet dressing.'
    src: p. 268
  without_medical_supplies:
    state: supported
    items:
    - text: Pressing directly with your hands is the main treatment and needs no equipment. IFRC says the infection risk is very low if your own hands have no open cuts.
      src: pp. 256, 259
    - text: 'No gloves: cover your hands with plastic bags, cloth or clothing.'
      src: p. 256
    - text: 'No bandage once the bleeding is controlled: use clean clothes or towels.'
      src: p. 257
  supported_alternatives:
    state: supported
    items:
    - text: Tourniquet for life-threatening bleeding from an arm or leg. A manufactured one is preferred. An improvised one may be used if it is all you have.
      limits: Arm or leg only. IFRC's evidence review says improvised tourniquets tend to work very poorly and often fail. It reports plastic turning sticks breaking and leather belts snapping, and only 1 of 22 attempts with a version lacking a turning stick succeeding. It is very painful, and the person may react violently and try to pull it off, so warn them and protect yourself. It can cost the limb, especially if left on too long. For a child, IFRC names a manufactured tourniquet and does not mention an improvised one. Reading this is not training.
      src: pp. 256, 257, 260, 265, 266
    - text: 'Making one, from WHO''s community first aid responder guide: take a band or thick piece of cloth and a stick. Fasten it around the limb on the side of the wound nearer the body, then turn the stick to tighten until the bleeding stops, and fix it so it cannot unwind. Note the exact time on the tourniquet and on the person.'
      limits: IFRC gives no method for improvising. After an amputation, IFRC says a tourniquet may not stop all bleeding, and minor bleeding that is not gushing means it is working (p. 273).
      src: WHO CFAR pocket guide p. 4
    - text: If one tourniquet does not work, you can add a second above it, and keep pressing on the wound.
      limits: Arm or leg only.
      src: p. 257
    - text: In a disaster or attack, a tourniquet may be used first, to cope with many injured people or to get someone with life-threatening bleeding out of immediate danger.
      limits: Arm or leg only.
      src: p. 258
  if_help_is_delayed_or_unreachable:
    state: supported
    items:
    - text: Keep pressing while it is still bleeding. Keep the person warm and lying down, or in the position described for a chest wound.
      src: pp. 257, 267, 268, WHO CFAR pocket guide p. 3
    - text: Leave a tourniquet on until emergency services arrive. IFRC says this generally, and says for disasters and conflict that release is for a medical professional to guide. WHO says never to loosen one without consulting a health professional.
      src: pp. 257, 258, WHO CFAR pocket guide p. 4
    - text: No guidance was found in the sources checked on what to do with a tourniquet if no medical professional will ever be reachable.
      src: none-found
    - text: Get the person to hospital as fast as you can. Show and tell the staff where any tourniquet is and when it went on.
      src: WHO CFAR pocket guide p. 4
    - text: 'After an amputation: if the hospital is less than a few hours away, give nothing to eat or drink. If it is very far and the person responds, let them sip water.'
      src: p. 271
  no_effective_substitute_for:
    state: supported
    items:
    - text: Medical care. IFRC calls severe bleeding life-threatening and says it needs medical care.
      src: p. 258
  do_not:
  - text: Do not use pressure points or ice to stop bleeding.
    src: p. 256
  - text: Do not remove an object stuck in the wound.
    src: p. 257
  - text: Do not wrap a bandage around the limb instead of pressing directly on a severe bleed.
    src: pp. 256, 257
  - text: Do not loosen a tourniquet without a medical professional's guidance.
    src: p. 258, WHO CFAR pocket guide p. 4
  - text: Do not seal an open chest wound.
    src: p. 269
  reassess_and_change_actions:
  - text: If bleeding continues, press harder. If it is an arm or leg, consider a tourniquet.
    src: p. 257
  - text: If the person stops responding, once the bleeding is stopped, open the airway and check breathing, then use the matching card.
    src: p. 258
  - text: In a disaster, attack or conflict, your safety and the person's safety come before treatment.
    src: p. 258
untrained_scope:
  left_out:
  - what: Hemostatic dressings
    why: IFRC includes them but says training is required.
    src: pp. 256, 260
  - what: Wound packing, raising the limb and wrapped pressure dressing
    why: In the WHO guide (printed pp. 1, 3) but not in IFRC's steps, and IFRC prefers direct pressure to a wrapped dressing on a severe bleed. IFRC is the base.
    src: pp. 256, 257
  - what: Care of a severed body part
    why: Needs its own card. IFRC covers it in Amputation.
    src: p. 272
  kept_despite_training_assumption:
  - what: Improvised tourniquet
    why: IFRC allows it if nothing else is available, and the method comes from WHO's responder guide. Kept because someone with no other option may need it. Risks are stated beside it.
    src: p. 256
source_differences:
- Other public guidance limits tourniquet advice to a commercial device used by a trained person. IFRC allows an improvised one if it is all that is available. This card follows IFRC.
- 'Gap: what to do with a tourniquet if a medical professional can never be reached.'
- WHO's guide includes packing, raising the limb and a wrapped pressure dressing. IFRC does not include them in its steps. This card follows IFRC.
