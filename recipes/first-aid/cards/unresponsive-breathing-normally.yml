schema_version: 1
status: draft-check-5-applied
id: unresponsive-breathing-normally
language: en
title: Not responding, but breathing normally
audience: untrained-bystander
population: Adult, child and baby, with baby differences marked
age_definition: Go by how the person looks. A baby looks under about one year old.
age_groups: [adult, child, baby]
jurisdiction: Global (IFRC). Emergency numbers are not on this card.
protocol_family: ifrc-2025
emergency_number_profile: pending-regional-profile
source_ids:
- ifrc-2025
source_editions:
- IFRC International First Aid, Resuscitation and Education Guidelines 2025
query_aliases:
- unconscious but breathing
- passed out
- fainted and will not wake
- recovery position
- knocked out
- she is unconscious but breathing normally
applicability:
- The person does not respond to voice or touch and their breathing is normal
exclusions:
- 'Gasping, irregular, noisy or absent breathing: use the card for not breathing normally.'
display:
  urgent_help: Always get emergency help for someone who does not respond, even if they breathe normally.
  immediate_actions:
  - text: Check for a response. Gently shake the shoulders and ask loudly whether they are all right. For a baby, tap the foot.
    src: p. 153
  - text: 'Before moving them, ask whether a spine injury is possible: a fall or dive from a height, a dive into shallow water, being crushed, a road collision, a sports accident, an explosion or mechanical accident, or a head injury. In people over 65 or with a bone condition, even a minor slip or fall can cause one. Some people show no signs.'
    src: pp. 307, 308
  - text: 'Open the airway: ease the head back until the mouth opens, then raise the chin. For a baby, bring the head only to a neutral position. If no spine injury is possible, turn them onto their back first if needed. If one is possible, try to do this as they lie, and move them only as much as you must.'
    src: pp. 153, 161, 309
  - text: Spend up to 10 seconds watching the chest or belly, listening for breath and feeling for air on your cheek. Decide whether the breathing is normal. If you have any doubt, treat it as not normal and start CPR using the card for their age.
    src: pp. 153, 154, 159, 161, 188
  - text: 'IF BREATHING IS NORMAL AND A SPINE INJURY IS POSSIBLE: leave them as you found them, keep the airway open as in step 3, and gently support the head to prevent movement. Move them only if they are in danger or help has arrived. If they must be moved, two people are best, one keeping the head in line with the spine.'
    src: pp. 153, 307, 309
  - text: 'IF BREATHING IS NORMAL AND NO SPINE INJURY IS POSSIBLE: roll them onto their side and tilt the head back to keep the airway open. For a baby, use a neutral head position, and you can hold a baby this way in your arms. A pregnant person may be placed on their left side.'
    src: pp. 152, 153
  - text: Get emergency help.
    src: pp. 153, 154
  - text: Keep watching their breathing and whether they respond. If you can, try to find out why this happened.
    src: p. 153
  without_medical_supplies:
    state: supported
    items:
    - text: Every step on this card is done with your hands. No equipment is needed.
      src: p. 153
  supported_alternatives:
    state: supported
    items:
    - text: If you cannot roll the person onto their side, keep the airway open with the head tilt and chin lift.
      limits: For when there is no risk of a spine injury.
      src: p. 152
  if_help_is_delayed_or_unreachable:
    state: supported
    items:
    - text: Keep watching their breathing and response the whole time. Be ready to start CPR.
      src: pp. 153, 154
    - text: 'For a possible spine injury with help far away: if at least two people are present, you can turn the person onto their side while keeping the spine straight.'
      src: pp. 152, 154
    - text: No guidance was found in the sources checked on how long to keep waiting if help will never come. IFRC's general advice for long waits is to keep watching for changes, keep them warm or cool as needed, prevent infection, and arrange transport if possible.
      src: pp. 40, 121
  no_effective_substitute_for:
    state: none-known
    items:
    - text: Not responding may mean a serious condition. The sources checked name nothing a bystander can do in place of medical care.
      src: pp. 152, 153
  do_not:
  - text: Do not take longer than 10 seconds to check breathing.
    src: p. 152
  - text: Do not move someone with a possible spine injury if help will arrive soon.
    src: p. 152
  - text: Do not strap the head or neck, and do not use a neck collar.
    src: p. 307
  reassess_and_change_actions:
  - text: If breathing stops, becomes noisy, turns to gasping or is barely there, start CPR at once using the card for their age.
    src: pp. 152, 154
untrained_scope:
  left_out:
  - what: Jaw thrust
    why: 'Our decision: the steps are not described for an untrained reader. IFRC says it may move the neck less than the head tilt.'
    src: pp. 152, 153
  - what: AVPU scale
    why: 'Our decision: not needed for these steps. IFRC says no formal training is needed to use it.'
    src: p. 158
source_differences:
- IFRC notes that resuscitation councils differ slightly on when to call for help for an unconscious child or baby (p. 154). This card follows IFRC's own steps.
- IFRC's two-person turn when help is far away (p. 154) is worded differently from its spinal injury section, which says to move only once help arrives or if the person is in danger (p. 307). This card gives both.
- 'Turning for the airway check: IFRC''s steps start with the person on their back (p. 153) and say you may need to turn them (p. 161), while its spinal section says to leave the person as found (p. 309). This card leaves them as found where it can.'
review:
