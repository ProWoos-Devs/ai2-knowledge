schema_version: 1
status: draft-check-5-applied
id: unresponsive-abnormal-breathing-adult
language: en
title: Not responding and not breathing normally, adult or teenager
audience: untrained-bystander
population: Adult or adolescent
age_definition: Someone you think has gone through puberty. If they look like a child or baby, use that card.
age_groups: [adult]
family: cpr
jurisdiction: Global (IFRC). Emergency numbers are not on this card.
protocol_family: ifrc-2025
emergency_number_profile: pending-regional-profile
source_ids:
- ifrc-2025
source_editions:
- IFRC International First Aid, Resuscitation and Education Guidelines 2025
query_aliases:
- CPR
- heart stopped
- cardiac arrest
- collapsed
- only gasping
- not breathing
- he collapsed and is only gasping
- no defibrillator
- no AED
applicability:
- Does not respond, and breathing is absent, gasping, noisy or irregular. If you are unsure whether breathing is normal, treat it as not normal.
exclusions:
- Child or baby. Use the card for their age.
display:
  urgent_help: 'Shout for help and have someone get emergency help now. Alone with a phone: call on speaker and start. Alone with no phone nearby: leave the person, get help as fast as you can, then start. Say clearly that the person is not responding and not breathing normally. The call taker may be able to guide you through CPR.'
  immediate_actions:
  - text: Check for a response. Gently shake the shoulders and ask loudly whether they are all right.
    src: p. 161
  - text: Open the airway. Tilt the head back and lift the chin. You may need to roll them onto their back.
    src: p. 161
  - text: Spend up to 10 seconds watching the chest or belly, listening for breath and feeling for air on your cheek. Decide whether the breathing is normal. Gasping is not normal. If unsure, treat it as not normal.
    src: p. 161
  - text: Get help as described above.
    src: p. 162
  - text: Start chest compressions without delay. Put your dominant hand on the center of the chest with the other on top. Push fast and steadily, 100 to 120 times a minute, about 5 cm deep and no more than 6 cm. Let the chest come back up fully each time.
    src: pp. 159, 160, 162
  - text: If you are able and willing, give 2 mouth-to-mouth breaths after every 30 compressions. Blow steadily for about one second each, so the chest rises. Keep this pause under 10 seconds. Breaths are preferred for a teenager. They may help most after drowning, choking, strangulation or opioid overdose, or when a defibrillator will be delayed.
    src: pp. 160, 161, 162, 220
  - text: If you cannot or will not give breaths, do compressions alone. Where emergency help can reach you, start compressions rather than hesitate over breaths.
    src: pp. 162, 164
  - text: Ask someone to fetch a defibrillator (AED) if one exists. If you are alone and can see one close by, you can leave the person to get it quickly. Keep doing CPR while it is set up, and pause only when it is ready to analyze or give a shock. Follow its voice prompts. Restart compressions immediately after a shock. When the device checks the heart or gives a shock, make sure nobody is touching the person, and warn those around you.
    src: pp. 160, 162, 197, 198
  - text: If others are there, swap every two minutes with no break in compressions.
    src: p. 162
  without_medical_supplies:
    state: supported
    items:
    - text: The steps on this card use only your hands and mouth. Do not wait for equipment before starting.
      src: p. 162
    - text: Use a firm surface if possible, but do not lose time moving the person.
      src: p. 160
  supported_alternatives:
    state: not-applicable
    items: []
  if_help_is_delayed_or_unreachable:
    state: supported
    items:
    - text: Keep going until the person shows signs of recovery (coughing, opening eyes, speaking or moving on purpose, and breathing normally), or a defibrillator or a professional tells you to pause.
      src: p. 162
    - text: After drowning or severe cold, keep going. CPR can still work even with no defibrillator.
      src: p. 162
    - text: If you must move the person from a remote place and no other care exists, keep doing CPR on a firm surface on the way.
      src: p. 162
    - text: Care for the person with respect at all times, including while moving them.
      src: pp. 161, 162
    - text: IFRC gives no time limit for stopping CPR on an adult when no help exists. Its 20-minute note is for babies and children. It does say that without emergency care the person is likely to die, and that first aiders may then need to confirm there are no signs of life, note the time and circumstances, and treat the body with respect.
      src: pp. 42, 164
  no_effective_substitute_for:
    state: supported
    items:
    - text: A defibrillator and advanced medical care. IFRC says a person in this state is unlikely to recover with CPR alone, and nothing is described that replaces a shock. IFRC also says survival depends on immediate and effective CPR, so do not delay it.
      src: p. 163
  do_not:
  - text: Do not rely on feeling for a pulse to decide. When unsure whether the heart has stopped, begin CPR.
    src: p. 159
  - text: Do not lean on the chest between compressions.
    src: p. 160
  - text: Do not hold back for fear of causing harm. In this situation you are unlikely to make things worse.
    src: p. 159
  reassess_and_change_actions:
  - text: A short period of seizure-like movement can happen at the start. When it stops, check the person again.
    src: p. 161
  - text: If the person recovers, keep watching them closely until help arrives, because breathing can stop again.
    src: p. 163
untrained_scope:
  left_out:
  - what: Pulse checks
    why: Reserved by IFRC for professional responders.
    src: p. 161
  - what: Defibrillator pad placement detail
    why: The device's voice prompts lead the rescuer.
    src: p. 162
